name: Supply chain evidence

# Records a build-time SBOM of everything this project actually pulls in,
# using CRACI runners (https://docs.craci.com/guides/runner-workflows/).
#
# Deliberately isolated from deploy-modal.yml:
#   - never runs on main, so it cannot touch the Modal deploy
#   - reads main, glasses-ui and mobile-app but never writes to any branch
#   - no pull_request trigger, so it cannot put a failing check on anyone's PR
#   - permissions are read-only and no secrets are used
#   - timeout-minutes caps the wait if the CRACI App is not installed yet,
#     instead of leaving jobs queued for GitHub's 24 hour maximum
#
# Requires the CRACI GitHub App on this repository. Settings -> Builds in
# CRACI, then install the App and grant it access to this repo.

on:
  workflow_dispatch:
  push:
    branches: [craci]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # The three supply chains that make up the product. Each job installs
  # dependencies for real, so CRACI's proxy records what is actually
  # fetched rather than what a lockfile claims.
  #
  # These jobs omit the `network` block on purpose: every preset is on and
  # unmatched traffic is still allowed, so the recording cannot be the
  # reason a build fails. The strict policy is exercised separately below.
  # --------------------------------------------------------------------

  backend:
    name: Backend (PyPI)
    runs-on: craci
    timeout-minutes: 20
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"

      # This branch holds the evidence: the pinned list and the script that
      # checks it.
      - uses: actions/checkout@v4

      # The product comes from main at whatever commit is current, so the
      # record describes the server as it is today, not as it was when this
      # branch was cut. Read-only: nothing is pushed, so deploy-modal.yml is
      # never triggered.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: product

      # The server's runtime dependencies are arguments to uv_pip_install()
      # inside fall_server.py. There is no requirements.txt and no lockfile
      # in the product, so a scanner that reads manifests finds nothing at
      # all here. supply-chain/backend-requirements.in copies those
      # declarations out and backend-requirements.txt pins everything they
      # resolve to. This step reads the declarations back out of the code
      # and fails if the copies have drifted, so a library added to the
      # server cannot slip past the record.
      - name: Check the pins still match what fall_server.py declares
        run: |
          set -euo pipefail
          python3 supply-chain/check_backend_pins.py \
            --source product/backend/fall_server.py \
            --declared supply-chain/backend-requirements.in \
            --pins supply-chain/backend-requirements.txt | tee backend-pins-report.txt

      # A virtual environment keeps the pinned versions apart from the
      # Python packages Ubuntu installs system-wide, which pip cannot
      # replace. --require-hashes refuses any file whose hash is not in the
      # lock, and any package the lock does not name.
      - name: Install the pinned set, so the fetches are recorded
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            ${SSL_CERT_FILE:+--cert "$SSL_CERT_FILE"} \
            --require-hashes -r supply-chain/backend-requirements.txt
          .venv/bin/python -m pip freeze > backend-installed.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dependencies
          path: |
            backend-pins-report.txt
            backend-installed.txt
            supply-chain/backend-requirements.txt

  glasses-ui:
    name: Glasses UI (npm)
    runs-on: craci
    timeout-minutes: 20
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"
      - uses: actions/checkout@v4
        with:
          ref: glasses-ui
      - name: Install and build the right-lens UI
        run: |
          npm ci
          npm run build

  mobile-app:
    name: Companion app (npm)
    runs-on: craci
    timeout-minutes: 20
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "4"
      - uses: actions/checkout@v4
        with:
          ref: mobile-app
      - name: Install companion app tooling
        run: npm ci

  # --------------------------------------------------------------------
  # The finding.
  #
  # mobile-app depends on puppeteer, whose postinstall hook downloads a
  # Chrome binary from storage.googleapis.com. That binary is not a package
  # in package-lock.json, so a lockfile-based SBOM never mentions it: it
  # reports "puppeteer" and stops there.
  #
  # Under a policy that allows only npm and GitHub, that download has no
  # matching rule and the job fails closed. The run below is expected to
  # fail, and the failure is the evidence. continue-on-error keeps it from
  # marking the whole workflow red.
  #
  # The reviewed-policy job next to it allows the host explicitly, which is
  # what accepting a build-time dependency should look like: a named host
  # in version control rather than an unnoticed fetch.
  # --------------------------------------------------------------------

  undeclared-fetch-blocked:
    name: Strict policy (expected to block Chrome download)
    runs-on: craci
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            presets: [npm, github]
      - uses: actions/checkout@v4
        with:
          ref: mobile-app
      - name: Install with npm and GitHub as the only allowed sources
        run: npm ci

  undeclared-fetch-reviewed:
    name: Reviewed policy (Chrome download named explicitly)
    runs-on: craci
    timeout-minutes: 20
    steps:
      - uses: cracicorp/setup@v1
        with:
          network: |
            default: deny
            presets: [npm, github]
            connections:
              # Chrome for Testing, pulled by puppeteer's postinstall hook.
              # Reviewed and accepted: it is a test-only dependency and does
              # not ship in the product.
              - tls:
                  serverNamePatterns: [storage.googleapis.com]
                  ports: [443]
      - uses: actions/checkout@v4
        with:
          ref: mobile-app
      - name: Install with the download allowed
        run: npm ci

  # --------------------------------------------------------------------
  # The companion app's Trust panel shows this evidence to the person
  # wearing the glasses, so it is held to the same record:
  #
  #   - the app's list of backend packages is the list the server declares
  #   - the panel data committed on mobile-app is exactly what its inputs
  #     produce, so nobody can hand-edit a tick into it
  #   - the scripts that decide all of this pass their own tests
  #
  # This job installs nothing and builds nothing, so there is no supply
  # chain here for CRACI to record. It runs on a GitHub-hosted runner and
  # is not one of the CRACI jobs.
  # --------------------------------------------------------------------

  trust-panel:
    name: Trust panel matches the evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: product
      - uses: actions/checkout@v4
        with:
          ref: mobile-app
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The app lists the backend packages the server declares
        run: |
          python3 supply-chain/check_backend_pins.py \
            --source product/backend/fall_server.py \
            --declared supply-chain/backend-requirements.in \
            --pins supply-chain/backend-requirements.txt \
            --mirror app/supply-chain/backend-declared.txt

      - name: The committed panel data is what its inputs produce
        run: node app/scripts/build-trust-panel.mjs --check

      - name: The scripts behind both checks pass their tests
        run: |
          python3 -m unittest discover -s supply-chain -p 'test_*.py'
          node --test app/scripts/trust-panel.test.mjs
